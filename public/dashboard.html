<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>HostReminder — Dashboard</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f7fb;color:#333}.nav{background:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:0;z-index:10}.nav h2{font-size:18px;color:#667eea}.nav span{font-size:13px;color:#888}.nav button{background:0;border:1px solid #e0e0e0;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;color:#666}.container{max-width:1200px;margin:24px auto;padding:0 24px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}.stat{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}.stat h3{font-size:28px;color:#667eea}.stat p{font-size:13px;color:#888;margin-top:4px}.section{background:#fff;border-radius:12px;padding:20px;margin-bottom:24px;box-shadow:0 2px 8px rgba(0,0,0,.04)}.section h3{font-size:16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}.section h3 button{background:#667eea;color:#fff;border:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12px}.prop{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f0f0f0}.prop:last-child{border:0}.prop .info h4{font-size:14px}.prop .info p{font-size:12px;color:#888;margin-top:2px}.badge{background:#e8f5e9;color:#2e7d32;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}.reservation{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:14px}.reservation:last-child{border:0}</style></head><body><div class="nav"><h2>🏡 HostReminder</h2><span id="userInfo">Chargement...</span><button onclick="logout()">Déconnexion</button></div><div class="container"><div class="stats"><div class="stat"><h3 id="statProps">-</h3><p>Propriétés</p></div><div class="stat"><h3 id="statReservations">-</h3><p>Réservations totales</p></div><div class="stat"><h3 id="statUpcoming">-</h3><p>À venir</p></div></div><div class="section" id="propertiesSection"><h3>Mes Propriétés <button onclick="addProperty()">+ Ajouter</button></h3><div id="propertiesList">Chargement...</div></div><div class="section" id="logsSection"><h3>Derniers Logs <button onclick="loadLogs()">↻</button></h3><pre id="logsContent" style="font-size:12px;background:#f8f9fa;padding:12px;border-radius:8px;max-height:300px;overflow:auto;white-space:pre-wrap"></pre></div></div><script>async function loadDashboard(){try{const r=await fetch('/dashboard');if(r.status===401){window.location.href='/login.html';return}const d=await r.json();document.getElementById('userInfo').textContent=`${d.user.name} (${d.user.email})`;document.getElementById('statProps').textContent=d.stats.properties;document.getElementById('statReservations').textContent=d.stats.totalReservations;document.getElementById('statUpcoming').textContent=d.stats.upcomingReservations;const list=document.getElementById('propertiesList');list.innerHTML=d.properties.map(p=>`<div class="prop"><div class="info"><h4>${p.name}</h4><p>${p._count.reservations} réservation(s)</p></div><span class="badge">${p.airbnbIcalUrl?'iCal ✓':'Manuel'}</span></div>`).join('')||'Aucune propriété'}catch(e){console.error(e)}}async function loadLogs(){try{const r=await fetch('/api/logs');const d=await r.json();document.getElementById('logsContent').textContent=d.logs.slice(-30).map(l=>`[${l.timestamp||''}] ${l.level||'info'}: ${l.message||JSON.stringify(l)}`).join('\n')||'Aucun log'}catch(e){document.getElementById('logsContent').textContent='Erreur de chargement'}}function logout(){fetch('/api/auth/logout',{method:'POST'}).then(()=>window.location.href='/login.html')}function addProperty(){window.location.href='/properties.html'}loadDashboard();loadLogs();</script></body></html>
