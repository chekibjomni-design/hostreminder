<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>HostReminder — Connexion</title>
  <style>
    body {font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;}
    .card {background:#fff;border-radius:16px;padding:40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
    h1 {text-align:center;margin-bottom:8px;color:#333;font-size:24px;}
    p {text-align:center;margin-bottom:24px;color:#888;font-size:14px;}
    .form-group {margin-bottom:16px;}
    label {display:block;margin-bottom:6px;font-size:13px;color:#555;}
    input {width:100%;padding:12px 16px;border:2px solid #e0e0e0;border-radius:10px;font-size:15px;transition:border-color .2s;}
    input:focus {outline:0;border-color:#667eea;}
    button {width:100%;padding:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s;}
    button:hover {opacity:.9;}
    .error {background:#fde8e8;color:#c53030;padding:10px;border-radius:8px;margin-bottom:16px;font-size:13px;display:none;}
    .link {text-align:center;margin-top:16px;font-size:13px;color:#888;}
    .link a {color:#667eea;text-decoration:none;}
  </style>
</head>
<body>
  <div class="card">
    <h1>🏡 HostReminder</h1>
    <p>Gérez vos propriétés et automatisez vos rappels</p>
    <div class="error" id="error"></div>
    <form id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="votre@email.com" required></div>
      <div class="form-group"><label>Mot de passe</label><input type="password" id="password" placeholder="••••••••" required></div>
      <button type="submit">Connexion</button>
    </form>
    <div class="link">Pas encore de compte ? <a href="#" id="showRegister">S'inscrire</a></div>
    <div class="social-login" style="margin-top:20px;text-align:center;">
      <p>ou connectez‑vous avec :</p>
      <a href="/api/auth/google" class="social-btn" style="display:inline-block;margin:5px;padding:10px 20px;background:#db4437;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">Google</a>
      <a href="/api/auth/facebook" class="social-btn" style="display:inline-block;margin:5px;padding:10px 20px;background:#3b5998;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">Facebook</a>
      <a href="/api/auth/airbnb" class="social-btn" style="display:inline-block;margin:5px;padding:10px 20px;background:#ff5a5f;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">Airbnb</a>
    </div>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const errorDiv = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.style.display = 'none';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ email, password })
        });
        const data = await resp.json();
        if (!resp.ok) {
          errorDiv.textContent = data.error || 'Erreur de connexion';
          errorDiv.style.display = 'block';
          return;
        }
        // login success -> redirect to dashboard
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorDiv.textContent = 'Erreur réseau';
        errorDiv.style.display = 'block';
      }
    });
    // Placeholder for registration handling – not implemented in this MVP
    document.getElementById('showRegister').addEventListener('click', (e) => {
      e.preventDefault();
      alert('Fonction d\'inscription non implémentée pour le moment');
    });
  </script>
</body>
</html>
