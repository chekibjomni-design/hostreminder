<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>HostReminder — Connexion</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}.card{background:#fff;border-radius:16px;padding:40px;width:400px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.3)}h1{text-align:center;margin-bottom:8px;color:#333;font-size:24px}p{text-align:center;color:#888;margin-bottom:24px;font-size:14px}.form-group{margin-bottom:16px}label{display:block;margin-bottom:6px;font-size:13px;font-weight:600;color:#555}input{width:100%;padding:12px 16px;border:2px solid #e0e0e0;border-radius:10px;font-size:15px;transition:border-color .2s}input:focus{outline:0;border-color:#667eea}button{width:100%;padding:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s}button:hover{opacity:.9}.error{background:#fde8e8;color:#c53030;padding:10px;border-radius:8px;margin-bottom:16px;font-size:13px;display:none}.link{text-align:center;margin-top:16px;font-size:13px;color:#888}.link a{color:#667eea;text-decoration:none}</style></head><body><div class="card"><h1>🏡 HostReminder</h1><p>Gérez vos propriétés et automatisez vos rappels</p><div class="error" id="error"></div><form id="loginForm"><div class="form-group"><label>Email</label><input type="email" id="email" placeholder="votre@email.com" required></div><div class="form-group"><label>Mot de passe</label><input type="password" id="password" placeholder="••••••••" required></div><button type="submit">Connexion</button></form><div class="link">Pas encore de compte ? <a href="#" id="showRegister">S'inscrire</a></div></div><script>const form=document.getElementById('loginForm');const error=document.getElementById('error');const link=document.querySelector('.link a');let isLogin=true;link.addEventListener('click',e=>{e.preventDefault();isLogin=!isLogin;form.querySelector('button').textContent=isLogin?'Connexion':"S'inscrire";link.textContent=isLogin?"S'inscrire":"Se connecter";document.querySelector('h1').textContent=isLogin?'🏡 HostReminder':'🏡 Créer un compte';error.style.display='none'});form.addEventListener('submit',async e=>{e.preventDefault();error.style.display='none';const email=document.getElementById('email').value;const password=document.getElementById('password').value;const endpoint=isLogin?'/api/auth/login':'/api/auth/register';const body=isLogin?{email,password}:{email,password,name:email.split('@')[0]};try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){error.textContent=d.error;error.style.display='block';return}window.location.href='/dashboard.html'}catch(e){error.textContent='Erreur de connexion au serveur';error.style.display='block'}});</script></body></html>
